name: Tempo

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

packages:
  TempoApple:
    path: .
  ConvexMobile:
    url: https://github.com/get-convex/convex-swift
    exactVersion: 0.8.1
  Auth0:
    url: https://github.com/auth0/Auth0.swift
    exactVersion: 2.17.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: 12
    MARKETING_VERSION: 0.1.0
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64

targets:
  Tempo:
    type: application
    platform: iOS
    sources:
      - path: Sources/TempoApp
      - path: Sources/SharedAssets/Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: TempoApple
        product: TempoCore
      - package: ConvexMobile
        product: ConvexMobile
      - package: Auth0
        product: Auth0
      - target: TempoWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fun.bhushan.tempo
        PRODUCT_NAME: Tempo
        DEVELOPMENT_TEAM: NPJKKT52N4
        CODE_SIGN_ENTITLEMENTS: Sources/TempoApp/Tempo.entitlements
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Sources/TempoApp/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: false
    postBuildScripts:
      - name: Embed runtime configuration
        path: Scripts/embed-runtime-config.sh
        basedOnDependencyAnalysis: false
    scheme:
      gatherCoverageData: false

  TempoWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/TempoWidgets
    dependencies:
      - package: TempoApple
        product: TempoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fun.bhushan.tempo.widgets
        PRODUCT_NAME: TempoWidgets
        DEVELOPMENT_TEAM: NPJKKT52N4
        INFOPLIST_FILE: Sources/TempoWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: Sources/TempoWidgets/TempoWidgets.entitlements
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
        TARGETED_DEVICE_FAMILY: "1"

  TempoMac:
    type: application
    platform: macOS
    sources:
      - path: Sources/TempoApp
        excludes:
          - AppRootView.swift
          - Info.plist
          - Tempo.entitlements
          - TempoApp.swift
      - path: Sources/TempoMacApp
      - path: Sources/SharedAssets/Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: TempoApple
        product: TempoCore
      - package: ConvexMobile
        product: ConvexMobile
      - package: Auth0
        product: Auth0
      - target: TempoMacWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fun.bhushan.tempo
        PRODUCT_NAME: Tempo
        DEVELOPMENT_TEAM: NPJKKT52N4
        CODE_SIGN_ENTITLEMENTS: Sources/TempoMacApp/TempoMac.entitlements
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Sources/TempoMacApp/Info.plist
        ENABLE_USER_SCRIPT_SANDBOXING: false
        "EXCLUDED_ARCHS[sdk=macosx*]": x86_64
    postBuildScripts:
      - name: Embed runtime configuration
        path: Scripts/embed-runtime-config.sh
        basedOnDependencyAnalysis: false
    scheme:
      gatherCoverageData: false

  TempoMacWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/TempoWidgets
        excludes:
          - Info.plist
          - TempoWidgets.entitlements
    dependencies:
      - package: TempoApple
        product: TempoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fun.bhushan.tempo.macwidgets
        PRODUCT_NAME: TempoMacWidgets
        DEVELOPMENT_TEAM: NPJKKT52N4
        INFOPLIST_FILE: Sources/TempoMacWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: Sources/TempoMacWidgets/TempoMacWidgets.entitlements
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
        "EXCLUDED_ARCHS[sdk=macosx*]": x86_64
